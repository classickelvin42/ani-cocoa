<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The shelf · Ani Cocoa Cosmetics</title>
  <meta name="description" content="Shop original self-care from Canada and the body-care shelf at Ani Cocoa Cosmetics in Spintex.">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="shop">
  <main id="main" class="page">
    <p class="kicker">@accosmetics.shop</p>
    <h1>The shelf.</h1>
    <p class="lede" data-shop-intro>Loading the shelf…</p>
    <div class="filters" data-filters>
      <button class="btn btn-ghost filter" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="btn btn-ghost filter" type="button" data-filter="house" aria-pressed="false">House</button>
      <button class="btn btn-ghost filter" type="button" data-filter="body" aria-pressed="false">Body</button>
      <button class="btn btn-ghost filter" type="button" data-filter="fragrance" aria-pressed="false">Fragrance</button>
    </div>
    <div class="products" data-shop></div>
  </main>
  <script type="module" src="js/shop.js"></script>
</body>
</html>
