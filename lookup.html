<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a reference · Ani Cocoa Cosmetics</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="main" class="page prose">
    <p class="kicker">References</p>
    <h1>Find a booking or a shelf request.</h1>
    <form data-lookup novalidate>
      <div class="error-summary" tabindex="-1" hidden><p>Please fix the following:</p><ul></ul></div>
      <label for="reference">Reference</label>
      <input id="reference" name="reference" required minlength="4" autocomplete="off">
      <button class="btn" type="submit">Look up</button>
    </form>
    <div class="summary" data-result hidden></div>
  </main>
  <script type="module" src="js/lookup.js"></script>
</body>
</html>
